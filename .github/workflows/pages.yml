name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Run offline regression tests
        run: node smoke-test.cjs

      - name: Package public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/js/app _site/assets/images _site/assets/hall-effect-switches
          cp index.html styles.css protocol.js app.js languages.xml about.html _site/
          cp js/app/*.js _site/js/app/
          cp assets/images/axis.png _site/assets/images/
          cp -R assets/images/he_switch_images _site/assets/images/
          node scripts/build-switch-image-manifest.cjs assets/images/he_switch_images _site/assets/images/he_switch_images/manifest.json
          cp assets/hall-effect-switches/supported-switches.json assets/hall-effect-switches/catalog-overrides.json _site/assets/hall-effect-switches/
          if [ -d assets/hall-effect-switches/images ]; then cp -R assets/hall-effect-switches/images _site/assets/hall-effect-switches/; fi
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
